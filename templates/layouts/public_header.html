{% load static %}
<header class="border-b border-border bg-surface">
  <div class="mx-auto max-w-7xl px-4 py-2 sm:py-3 flex items-center justify-between gap-2 sm:gap-3">
    
    <!-- Logo con filtro para modo oscuro -->
    <a href="{% url 'public:home' %}" class="flex items-center gap-2 shrink-0">
      <img src="{% static 'img/logo-iujo-oscuro.png' %}" alt="IUJO IntegraVida" 
           class="h-10 sm:h-12 w-auto max-w-[180px] sm:max-w-[220px] object-contain iv-logo-dark">
    </a>

    <!-- Menú de navegación -->
    <nav class="flex items-center gap-1 sm:gap-2 justify-end" aria-label="Navegación">
      <a href="{% url 'public:home' %}" class="btn btn-ghost text-xs sm:text-sm whitespace-nowrap px-2 sm:px-3">Inicio</a>
      <a href="{% url 'public:mapa_view' %}" class="btn btn-ghost text-xs sm:text-sm whitespace-nowrap px-2 sm:px-3">🗺️ Mapa</a>

      {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard:home' %}" class="btn btn-ghost text-xs sm:text-sm whitespace-nowrap px-2 sm:px-3">
          Ir al panel →
        </a>
      {% else %}
        <a href="{% url 'auth:login' %}" class="btn btn-ghost text-xs sm:text-sm whitespace-nowrap px-2 sm:px-3">
          Acceso institucional
        </a>
      {% endif %}

      {% include "components/theme-toggle.html" %}
    </nav>
    
  </div>
</header>
