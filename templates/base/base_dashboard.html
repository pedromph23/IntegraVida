{% load static %}<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ page_title|default:"Panel" }} · IntegraVida{% endblock %}</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('iv-theme');
        if (!t || t === 'system') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/dist/main.css' %}">
  {% block head_extra %}{% endblock %}
  <link rel="icon" type="image/x-icon" href=\'{% static "img/favicon.ico" %}\'>
</head>
<body class="min-h-screen bg-surface text-text antialiased">
  {% include "layouts/dashboard_header.html" %}
  <div class="flex">
    {% include "layouts/dashboard_sidebar.html" %}
    <main id="main" class="flex-1 min-w-0 p-4 md:p-8">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{% static 'js/dist/main.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
